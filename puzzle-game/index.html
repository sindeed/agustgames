<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pixelgubben">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="../apple-touch-icon.png">
  <title>Pixelgubben – ovanifrån-spel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <div id="hud">
      <div id="lives"><span id="lives-val"></span></div>
      <div id="level"></div>
      <div id="score">★ <span id="score-val">0</span></div>
      <div id="hud-buttons">
        <button class="iconbtn" id="pause-btn" title="Paus" aria-label="Paus">⏸</button>
        <button class="iconbtn" id="restart-btn" title="Börja om banan" aria-label="Börja om">↻</button>
        <button class="iconbtn" id="menu-btn" title="Till menyn" aria-label="Meny">🏠</button>
        <button class="iconbtn" id="sound" title="Ljud av/på" aria-label="Ljud">🔊</button>
      </div>
    </div>

    <canvas id="game" width="800" height="600"></canvas>

    <div id="overlay" class="overlay">
      <div class="overlay-box">
        <h1 id="overlay-title">Pixelgubben</h1>
        <p id="overlay-text"></p>
        <p class="hint" id="overlay-hint">
          Piltangenter / knapparna = gå &nbsp;•&nbsp; Mellanslag / HOPP = hoppa (över hål)<br>
          Knuffa stenar genom att gå in i dem. Akta dig för ormar och hål!<br>
          Nå <strong>stjärnan</strong> för att vinna.
        </p>
        <button id="overlay-btn">Starta</button>
        <div id="overlay-actions">
          <button id="overlay-restart">↻ Börja om banan</button>
          <button id="overlay-menu">🏠 Till menyn</button>
        </div>
      </div>
    </div>

    <div id="touch-controls">
      <div id="dpad">
        <button class="dbtn d-up" data-dir="ArrowUp" aria-label="Upp">▲</button>
        <button class="dbtn d-left" data-dir="ArrowLeft" aria-label="Vänster">◀</button>
        <button class="dbtn d-right" data-dir="ArrowRight" aria-label="Höger">▶</button>
        <button class="dbtn d-down" data-dir="ArrowDown" aria-label="Ner">▼</button>
      </div>
      <button id="jump-btn" aria-label="Hoppa">HOPP</button>
    </div>
  </div>

  <!-- Ladda alltid senaste game.js (cache-busting) så nya banor syns direkt -->
  <script>
    (function () {
      var s = document.createElement("script");
      s.src = "game.js?v=" + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
